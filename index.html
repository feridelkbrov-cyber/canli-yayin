<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Yayım Platforması</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; }
    header { width: 100%; max-width: 900px; padding: 15px 0; text-align: center; border-bottom: 1px solid #334155; margin-bottom: 20px; }
    header h1 { font-size: 1.5rem; color: var(--accent); }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    .player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    iframe { width: 100%; height: 100%; border: none; }
    .no-stream { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-size: 0.9rem; text-align: center; padding: 10px; }
    .stream-list { display: flex; flex-direction: column; gap: 10px; }
    .stream-item { background: var(--card-bg); padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; border: 1px solid #334155; }
    .stream-item:hover { border-color: var(--accent); }
    .stream-title { font-weight: 600; font-size: 1rem; }
    .live-badge { background: #ef4444; color: #fff; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; font-weight: bold; }
    .admin-section { margin-top: 30px; background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid #334155; }
    .admin-section h3 { margin-bottom: 10px; font-size: 1.1rem; }
    .form-group { display: flex; flex-direction: column; gap: 10px; }
    input, button { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.9rem; }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:hover { opacity: 0.9; }
    .delete-btn { background: #ef4444; color: white; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; border: none; }
  </style>
</head>
<body>

  <header>
    <h1>🔴 Canlı Yayımlar</h1>
  </header>

  <div class="container">
    <div class="player-container" id="playerContainer">
      <div class="no-stream">Yayıma baxmaq üçün aşağıdakı siyahıdan birini seçin</div>
    </div>

    <h3 style="margin-top: 10px;">Aktiv Yayımlar</h3>
    <div class="stream-list" id="streamList">
      <p style="color: var(--text-dim); font-size: 0.9rem;">Yayımlar yüklənir...</p>
    </div>

    <div class="admin-section">
      <h3>Admin Paneli (Yayım Əlavə Et)</h3>
      <div class="form-group" id="adminForm">
        <input type="password" id="adminKey" placeholder="Admin Parolunu daxil edin">
        <input type="text" id="streamTitle" placeholder="Yayımın Adı (məs: İdman TV)">
        <input type="text" id="streamUrl" placeholder="Yayım Linki (YouTube / Embed / M3U8 Linki)">
        <button id="addBtn" onclick="addStream()">Yayımlara Əlavə Et</button>
      </div>
    </div>
  </div>

  <script>
    const SECRET_PIN = "NiCaTo2o";
    
    // Hamı üçün açıq qlobal baza linki
    const BASE_URL = "https://api.jsonstorage.net/v1/json/8a6e8b42-a8fb-4560-8431-893fbd2ca521/a038cf56-2db1-4c12-b258-20d0e657c91e";

    let streams = [];

    async function fetchStreams() {
      try {
        const res = await fetch(BASE_URL + `?nocache=${Date.now()}`);
        if (!res.ok) throw new Error("Baza xətası");
        const data = await res.json();
        streams = Array.isArray(data) ? data : (data.streams || []);
      } catch (err) {
        console.error("Yüklənmə xətası:", err);
        streams = [];
      }
      renderStreams();
    }

    async function updateDatabase() {
      try {
        const res = await fetch(BASE_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(streams)
        });
        if (!res.ok) throw new Error("Yenilənmə xətası");
        return true;
      } catch (err) {
        alert("Bazaya yazıla bilmədi. İnternet bağlantınızı yoxlayın.");
        return false;
      }
    }

    function renderStreams() {
      const listEl = document.getElementById('streamList');
      listEl.innerHTML = '';

      if (!streams || streams.length === 0) {
        listEl.innerHTML = '<p style="color: var(--text-dim); font-size: 0.9rem;">Hal-hazırda aktiv yayım yoxdur.</p>';
        return;
      }

      streams.forEach((s, index) => {
        const item = document.createElement('div');
        item.className = 'stream-item';
        item.innerHTML = `
          <div onclick="playStream(${index})" style="flex-grow: 1;">
            <span class="stream-title">${sanitizeHTML(s.title)}</span>
            <span class="live-badge">CANLI</span>
          </div>
          <button class="delete-btn" onclick="deleteStream(${index})">Sil</button>
        `;
        listEl.appendChild(item);
      });
    }

    function playStream(index) {
      const player = document.getElementById('playerContainer');
      let url = streams[index].url;
      
      if (url.includes('youtube.com/live/')) {
        url = url.replace('youtube.com/live/', 'youtube.com/embed/').split('?')[0];
      } else if (url.includes('watch?v=')) {
        url = url.replace('watch?v=', 'embed/').split('&')[0];
      }

      player.innerHTML = `
        <iframe src="${sanitizeHTML(url)}" 
                allowfullscreen 
                sandbox="allow-scripts allow-same-origin allow-presentation">
        </iframe>`;
    }

    async function addStream() {
      const pin = document.getElementById('adminKey').value;
      const title = document.getElementById('streamTitle').value;
      let url = document.getElementById('streamUrl').value;

      if (pin !== SECRET_PIN) {
        alert("Səhv admin parolu!");
        return;
      }

      if (!title || !url) {
        alert("Bütün xanaları doldurun!");
        return;
      }

      const btn = document.getElementById('addBtn');
      btn.innerText = "Əlavə edilir...";
      btn.disabled = true;

      streams.push({ title, url });
      
      const success = await updateDatabase();
      if (success) {
        document.getElementById('streamTitle').value = '';
        document.getElementById('streamUrl').value = '';
        alert("Yayım uğurla əlavə olundu və hamı üçün aktiv edildi!");
      }

      btn.innerText = "Yayımlara Əlavə Et";
      btn.disabled = false;
      fetchStreams();
    }

    async function deleteStream(index) {
      const pin = prompt("Yayımı silmək üçün Admin Parolunu yazın:");
      if (pin === SECRET
